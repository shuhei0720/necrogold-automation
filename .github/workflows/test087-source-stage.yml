name: Stage TEST088 evidence-only source release

on:
  workflow_dispatch:
  push:
    branches: [work/p1-capture-probe]
    paths: ['.github/workflows/test087-source-stage.yml']

permissions:
  contents: read

jobs:
  stage-source:
    if: github.repository == 'shuhei0720/necrogold-automation' && github.ref == 'refs/heads/work/p1-capture-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check frozen code and create the complete source archive
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, stat, subprocess, zipfile
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args])
          head = git('rev-parse', 'HEAD').decode().strip()
          assert head == os.environ['GITHUB_SHA']
          code = 'c3ac8eb357ab3c11adfdfe2ce60b1cc3fa125085'
          allowed = {'.github/workflows/test087-source-stage.yml',
                     'docs/status.md', 'docs/device-tests/README.md', 'docs/contracts/target-assessment.md',
                     'docs/plans/test088-evidence.md', 'docs/reviews/test088-evidence.md',
                     'necroprobe/evidence088.py', 'evidence_088.sh', 'tests/test_evidence088.py'}
          changed = {x.decode() for x in git('diff', '--name-only', '-z', code, head).split(b'\0') if x}
          assert changed <= allowed, changed
          paths = [x.decode() for x in git('ls-tree', '-r', '--name-only', '-z', head).split(b'\0') if x]
          assert len(paths) == 682
          baseline = 'c3ac8eb357ab3c11adfdfe2ce60b1cc3fa125085'
          preserved = [p for p in paths if p.startswith(('patches/loopctrl/', 'legacy/r12/'))]
          preserved += ['necroprobe/native_walk.py', 'necroprobe/test069.py', 'necroprobe/test087.py',
                        'necroprobe/protocol.py', 'necroprobe/validation.py',
                        'necroprobe/target_ring_features.json', 'test_087.sh',
                        'necroprobe/target_assessment.py', 'necroprobe/test088.py', 'test_088.sh']
          assert len(preserved) == 124 and sum(p.startswith('legacy/r12/') for p in preserved) == 40
          for p in preserved:
              assert git('show', head+':'+p) == git('show', baseline+':'+p), p
          checked = {'necroprobe/evidence088.py': 'f887e5a265ee538c4c5902e3bc64d65f59922a305f68cc26c6dab617118fda95', 'evidence_088.sh': 'a79050c3f53fbe8f1b7cf7d6f4147aee2879f5166edee0f84c5f3c1dbc8e961e', 'tests/test_evidence088.py': '817b07d0e5f435f0174822ec5ce4d6260f487d078295aca5c0b8655898b47061'}
          for p, expected in checked.items():
              assert hashlib.sha256(git('show', head+':'+p)).hexdigest() == expected, p
          out = Path(os.environ['RUNNER_TEMP'])/'source-stage'; out.mkdir()
          archive = out/'source.zip'
          subprocess.run(['git', 'archive', '--format=zip', '--prefix=necro_test088_evidence/',
                          '--output='+str(archive), head], check=True)
          with zipfile.ZipFile(archive) as package:
              assert package.testzip() is None
              assert len(package.namelist()) == len(set(package.namelist()))
              actual = {}
              for entry in package.infolist():
                  path = Path(entry.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert not stat.S_ISLNK(entry.external_attr >> 16)
                  if not entry.is_dir():
                      assert entry.filename.startswith('necro_test088_evidence/')
                      actual[entry.filename.split('/', 1)[1]] = entry
              assert set(actual) == set(paths)
              for p, entry in actual.items():
                  assert package.read(entry) == git('show', head+':'+p), p
          sha = hashlib.sha256(archive.read_bytes()).hexdigest()
          (out/'SHA256SUMS.txt').write_text(sha+'  source.zip\n')
          (out/'stage-receipt.json').write_text(json.dumps(dict(commit=head, code=code,
              tracked_files=len(paths), bytes=archive.stat().st_size, sha256=sha,
              all_crc_valid=True, all_bytes_match=True, preserved_paths=len(preserved),
              new_ipa_build=0, release_tag='test088-evidence-recovery', draft_only=True), indent=2)+'\n')
          PY
      - name: Upload only source and checksum to the fixed draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api repos/shuhei0720/necrogold-automation/releases/442982728 > "$RUNNER_TEMP/draft.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads((Path(os.environ['RUNNER_TEMP'])/'draft.json').read_text())
          assert release['id'] == 442982728 and release['draft'] is True
          assert release['tag_name'] == 'test088-evidence-recovery' and not release['assets']
          assert release['target_commitish'] in ('c3ac8eb357ab3c11adfdfe2ce60b1cc3fa125085', os.environ['GITHUB_SHA'])
          PY
          gh api --method PATCH repos/shuhei0720/necrogold-automation/releases/442982728 -f tag_name=test088-evidence-recovery -f target_commitish="$GITHUB_SHA" > "$RUNNER_TEMP/updated-draft.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads((Path(os.environ['RUNNER_TEMP'])/'updated-draft.json').read_text())
          assert release['id'] == 442982728 and release['draft'] is True and not release['assets']
          assert release['tag_name'] == 'test088-evidence-recovery' and release['target_commitish'] == os.environ['GITHUB_SHA']
          PY
          curl --fail --silent --show-error --request POST --connect-timeout 20 --max-time 120 \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Content-Type: application/zip' \
            --data-binary @"$RUNNER_TEMP/source-stage/source.zip" \
            'https://uploads.github.com/repos/shuhei0720/necrogold-automation/releases/442982728/assets?name=source.zip' > /dev/null
          curl --fail --silent --show-error --request POST --connect-timeout 20 --max-time 120 \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Content-Type: text/plain' \
            --data-binary @"$RUNNER_TEMP/source-stage/SHA256SUMS.txt" \
            'https://uploads.github.com/repos/shuhei0720/necrogold-automation/releases/442982728/assets?name=SHA256SUMS.txt' > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: test088-evidence-source-stage
          path: ${{ runner.temp }}/source-stage/
          if-no-files-found: error
          retention-days: 30
