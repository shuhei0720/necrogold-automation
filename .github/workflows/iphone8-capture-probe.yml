name: iPhone 8 capture-only probe

on:
  push:
    branches: [work/p1-capture-probe]
    paths:
      - .github/workflows/iphone8-capture-probe.yml
      - patches/loopctrl/iphone8_probe/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-host-contracts:
    runs-on: macos-26
    timeout-minutes: 15
    outputs:
      overlay_ready: ${{ steps.overlay.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run only the declared probe host phase
        run: python3 patches/loopctrl/iphone8_probe/check_host.py --output "$RUNNER_TEMP/ng8-host"
      - name: Verify the isolated source and package boundaries
        run: python3 -m unittest discover -s patches/loopctrl/iphone8_probe -p 'test_*.py' -v
      - name: Run the focused service boundary phase when present
        run: |
          if [ -f patches/loopctrl/iphone8_probe/check_service.py ]; then
            python3 patches/loopctrl/iphone8_probe/check_service.py --output "$RUNNER_TEMP/ng8-service"
          fi
      - name: Detect the sealed build stage
        id: overlay
        run: |
          if [ -f patches/loopctrl/iphone8_probe/manifest.json ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Save public fixture diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: iphone8-probe-host-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ng8-host/
            ${{ runner.temp }}/ng8-service/
          if-no-files-found: error
          retention-days: 30
  isolated-unsigned-build:
    needs: isolated-host-contracts
    if: needs.isolated-host-contracts.outputs.overlay_ready == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: driver
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Souitou-iop/LoopCtrl
          ref: 6e25cf6a9f65bc86c372cdce94bdb151d0cf6767
          path: upstream
          persist-credentials: false
      - name: Verify the original seals and apply the independent overlay
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ng8-build"
          python3 driver/patches/loopctrl/apply_patch.py upstream
          python3 driver/patches/loopctrl/apply_ngg2.py upstream
          python3 driver/patches/loopctrl/iphone8_probe/apply_overlay.py upstream
      - name: Install the standard unsigned build tools
        run: |
          brew install xcodegen
          rustup target add aarch64-apple-ios
          xcodebuild -version
          swiftc --version
          rustc --version
      - name: Configure and inspect the actual generated project
        run: |
          set -euo pipefail
          mkdir -p upstream/Config
          printf '// CI: unsigned build, no team.\nDEVELOPMENT_TEAM =\n' > upstream/Config/Local.xcconfig
          (cd upstream && xcodegen generate --spec project.yml)
          python3 driver/patches/loopctrl/check_perception_build.py --project --profile-version 3 upstream "$RUNNER_TEMP/ng8-build/perception-build"
      - name: Build the independent capture-only IPA
        working-directory: upstream
        run: |
          set -euo pipefail
          BUILD_NUMBER=$((800000 + GITHUB_RUN_NUMBER))
          SOURCE_SHA=$(shasum -a 256 ../driver/patches/loopctrl/iphone8_probe/manifest.json | cut -d ' ' -f 1)
          make ipa UNSIGNED=1 EXTRA_BUILD_SETTINGS="CURRENT_PROJECT_VERSION=$BUILD_NUMBER NG8_CAPTURE_PROBE_SOURCE_SHA256=$SOURCE_SHA" 2>&1 | tee "$RUNNER_TEMP/ng8-build/ios-build.txt"
          Scripts/package-release.sh 2>&1 | tee "$RUNNER_TEMP/ng8-build/ios-package.txt"
      - name: Verify actual compiler inputs and final dual seals
        run: |
          set -euo pipefail
          python3 driver/patches/loopctrl/check_perception_build.py --compile-profile --profile-version 3 upstream "$RUNNER_TEMP/ng8-build/ios-build.txt" "$RUNNER_TEMP/ng8-build/perception-build"
          python3 driver/patches/loopctrl/iphone8_probe/verify_package.py upstream driver upstream/release/LoopCtrl.ipa --build-number "$((800000 + GITHUB_RUN_NUMBER))" --build-log "$RUNNER_TEMP/ng8-build/ios-build.txt" --compiler-profile "$RUNNER_TEMP/ng8-build/perception-build"
      - name: Package and verify complete public source
        run: |
          set -euo pipefail
          python3 driver/patches/loopctrl/iphone8_probe/package_source.py upstream driver upstream/release/source.zip
          python3 driver/patches/loopctrl/iphone8_probe/verify_package.py upstream driver upstream/release/LoopCtrl.ipa --build-number "$((800000 + GITHUB_RUN_NUMBER))" --build-log "$RUNNER_TEMP/ng8-build/ios-build.txt" --compiler-profile "$RUNNER_TEMP/ng8-build/perception-build" --source-zip upstream/release/source.zip
      - name: Publish only the verified independent prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BUILD_NUMBER=$((800000 + GITHUB_RUN_NUMBER))
          TAG="iphone8-capture-probe-build$BUILD_NUMBER"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Existing release must be reconciled; refusing to overwrite.' >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/ng8-build/release-notes.txt" <<'NOTES'
          iPhone 8 capture-only diagnostic. No game automation or native input is enabled in capture-only mode. This prerelease is separate from TEST107 and the production iPhone 11 launcher. Physical-device acceptance has not yet been performed.

          The unsigned IPA, full source archive, final source/compiler manifest, and hashes were verified together by this workflow. No private device evidence, pairing files, signing identities, or personal configuration are included.
          NOTES
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "iPhone 8 capture probe build $BUILD_NUMBER" --notes-file "$RUNNER_TEMP/ng8-build/release-notes.txt" upstream/release/LoopCtrl.ipa upstream/release/source.zip upstream/release/SHA256SUMS.txt upstream/release/iphone8-probe-build-manifest.json
      - name: Save public build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: iphone8-probe-build-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ng8-build/
            upstream/release/iphone8-probe-build-manifest.json
          if-no-files-found: error
          retention-days: 30
