name: Native client readiness and recovery

on:
  push:
    branches: [work/p1-capture-probe]
    paths:
      - 'necroprobe/protocol.py'
      - 'necroprobe/native_walk.py'
      - 'test_044.sh'
      - 'test_045.sh'
      - 'test_046.sh'
      - 'test_047.sh'
      - 'test_048.sh'
      - 'test_049.sh'
      - 'test_050.sh'
      - 'test_051.sh'
      - 'test_052.sh'
      - 'test_053.sh'
      - 'test_054.sh'
      - 'test_055.sh'
      - 'test_056.sh'
      - 'test_057.sh'
      - 'test_058.sh'
      - 'test_059.sh'
      - 'tests/test_http_diagnostics.py'
      - 'tests/test_native_connect.py'
      - 'tests/test_native_walk.py'
      - 'tests/test_native_results.py'
      - 'tests/test_native_paged_results.py'
      - 'tests/test_native_export_batch.py'
      - 'tests/test_native_motion_references.py'
      - 'tests/test_protocol.py'
      - 'tests/test_http_and_cli.py'
      - 'tests/timer_support.py'
      - '.github/workflows/native-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate the shell entry point
        run: |
          sh -n test_055.sh
          sh -n test_056.sh
          sh -n test_057.sh
          sh -n test_058.sh
          sh -n test_059.sh
      - name: Prepare the existing legacy image-test dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/test055-venv"
          "$RUNNER_TEMP/test055-venv/bin/pip" install Pillow==11.3.0
      - name: Run readiness, encrypted HTTP, cancellation and recovery contracts
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/test055-venv/bin/python" --version
          PYTHONPATH=tests "$RUNNER_TEMP/test055-venv/bin/python" -m unittest test_protocol test_http_and_cli test_http_diagnostics test_native_walk test_native_connect test_native_results test_native_paged_results test_native_export_batch test_native_motion_references -v 2>&1 | tee "$RUNNER_TEMP/test055-client.txt"
      - name: Save client validation output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test055-client-validation
          path: ${{ runner.temp }}/test055-client.txt
          if-no-files-found: error
          retention-days: 30
