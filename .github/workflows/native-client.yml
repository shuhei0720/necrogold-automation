name: Native client readiness and recovery

on:
  push:
    branches: [work/p1-capture-probe]
    paths:
      - 'necroprobe/protocol.py'
      - 'necroprobe/native_walk.py'
      - 'test_044.sh'
      - 'tests/test_http_diagnostics.py'
      - 'tests/test_native_connect.py'
      - 'tests/test_native_walk.py'
      - 'tests/test_protocol.py'
      - 'tests/test_http_and_cli.py'
      - 'tests/timer_support.py'
      - '.github/workflows/native-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate the shell entry point
        run: sh -n test_044.sh
      - name: Run readiness, encrypted HTTP, cancellation and recovery contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          PYTHONPATH=tests python3 -m unittest test_protocol test_http_and_cli test_http_diagnostics test_native_walk test_native_connect -v 2>&1 | tee "$RUNNER_TEMP/test044-client.txt"
      - name: Save client validation output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test044-client-validation
          path: ${{ runner.temp }}/test044-client.txt
          if-no-files-found: error
          retention-days: 30
