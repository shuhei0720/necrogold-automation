name: LoopCtrl native control and geometry

on:
  workflow_dispatch:
    inputs:
      native_lane:
        description: Rapid device units and IPA; focused/full synthetic validation remains explicit
        type: choice
        required: true
        default: device
        options: [device, focused, full, publish-download, test058-red, test058-quick]
      artifact_id:
        type: string
        required: false
        default: ''
      archive_sha256:
        type: string
        required: false
        default: ''
      ipa_sha256:
        type: string
        required: false
        default: ''
      source_commit:
        type: string
        required: false
        default: ''
      source_sha256:
        type: string
        required: false
        default: ''
      release_id:
        type: string
        required: false
        default: ''
      release_tag:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  native-contract-red:
    needs: native-source-ready
    if: inputs.native_lane == 'full' && needs.native-source-ready.outputs.ready != 'true'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: driver
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Souitou-iop/LoopCtrl
          ref: 6e25cf6a9f65bc86c372cdce94bdb151d0cf6767
          path: upstream
          persist-credentials: false
      - name: Observe original TEST050 public paged-results manifest assertion Red
        run: |
          python3 driver/patches/loopctrl/check_ngg2.py --test051-red-only upstream "$RUNNER_TEMP/ngg2-baseline"
      - name: Save native baseline diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: loopctrl-ngg2-baseline
          path: ${{ runner.temp }}/ngg2-baseline/
          if-no-files-found: error
          retention-days: 30
  test058-dispatch-red:
    if: inputs.native_lane == 'test058-red'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: driver
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Souitou-iop/LoopCtrl
          ref: 6e25cf6a9f65bc86c372cdce94bdb151d0cf6767
          path: upstream
          persist-credentials: false
      - name: Apply guarded source and observe fixed TEST057 dispatch assertion Red
        run: |
          python3 driver/patches/loopctrl/apply_patch.py upstream
          python3 driver/patches/loopctrl/apply_ngg2.py upstream
          python3 driver/patches/loopctrl/check_ngg2.py --test058-red-only upstream "$RUNNER_TEMP/test058-baseline"
      - name: Save original TEST058 assertion Red evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: loopctrl-test058-dispatch-red
          path: |
            ${{ runner.temp }}/test058-baseline/*.json
            ${{ runner.temp }}/test058-baseline/*.txt
          if-no-files-found: error
          retention-days: 30
  test058-quick:
    if: inputs.native_lane == 'test058-quick'
    needs: [native-source-ready, native-host-contracts]
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: driver
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Souitou-iop/LoopCtrl
          ref: 6e25cf6a9f65bc86c372cdce94bdb151d0cf6767
          path: upstream
          persist-credentials: false
      - name: Apply source and run TEST058 deadline and shop contracts
        run: |
          python3 driver/patches/loopctrl/apply_patch.py upstream
          python3 driver/patches/loopctrl/apply_ngg2.py upstream
          python3 driver/patches/loopctrl/check_ngg2.py --test058-red-only upstream "$RUNNER_TEMP/test058-baseline"
          python3 driver/patches/loopctrl/check_ngg2.py --test058-public-only upstream "$RUNNER_TEMP/test058-preparation"
          python3 driver/patches/loopctrl/check_ngg2.py --test058-new-mutations-only upstream "$RUNNER_TEMP/test058-faults"
          python3 driver/patches/loopctrl/check_ngg2.py --test058-shop-only upstream "$RUNNER_TEMP/test058-shop"
          python3 driver/patches/loopctrl/check_ngg2.py --test058-runtime-green-only upstream "$RUNNER_TEMP/test058-runtime-green"
      - name: Save TEST058 focused compile and execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: loopctrl-test058-quick
          path: |
            ${{ runner.temp }}/test058-baseline/*.json
            ${{ runner.temp }}/test058-baseline/*.txt
            ${{ runner.temp }}/test058-preparation/*.json
            ${{ runner.temp }}/test058-preparation/*.txt
            ${{ runner.temp }}/test058-faults/*.json
            ${{ runner.temp }}/test058-faults/*.txt
            ${{ runner.temp }}/test058-shop/*.json
            ${{ runner.temp }}/test058-shop/*.txt
            ${{ runner.temp }}/test058-runtime-green/*.json
            ${{ runner.temp }}/test058-runtime-green/*.txt
          if-no-files-found: error
          retention-days: 30
  native-source-ready:
    if: inputs.native_lane != 'publish-download'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.manifest.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: manifest
        name: Require a sealed native source manifest for IPA builds
        shell: bash
        run: |
          if test -f patches/loopctrl/ngg2-manifest.json; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
  native-host-contracts:
    needs: native-source-ready
    if: needs.native-source-ready.outputs.ready == 'true' && (inputs.native_lane == 'full' || inputs.native_lane == 'test058-quick')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the existing image-test dependency in an isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/ngg2-host-venv"
          "$RUNNER_TEMP/ngg2-host-venv/bin/pip" install Pillow==11.3.0
      - name: Run native algorithm contracts without private image fixtures
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_TEMP/ngg2-no-private-fixtures"
          NECRO_TEST043_FIXTURE_ROOT="$RUNNER_TEMP/ngg2-no-private-fixtures" NECRO_TEST060_WORLD_EVIDENCE="$RUNNER_TEMP/test060-world" "$RUNNER_TEMP/ngg2-host-venv/bin/python" - <<'PY' 2>&1 | tee "$RUNNER_TEMP/ngg2-native-host.txt"
          import sys
          import unittest
          from pathlib import Path
          sys.path.insert(0, str(Path('tests').resolve()))
          fixture_cases = {
              'test_known_floor_public_entry', 'test_required_known_image_parity',
              'test_padding_ignored', 'test_sanitized_real_images_and_buffer_boundaries',
              'test_required034_to042_route_motion_and_all73_score_parity',
              'test_actual037_single_partial_gold_step_retains_stone_evidence',
              'test_required_test045_subtile_motion_replay',
              'test_required_test046_capture_replay',
              'test_required_test048_strict_optimization_parity',
              'test_required_test049_navigation_strict_optimization_parity',
              'test_required_test051_target_drift_and_strict_parity',
              'test_required_test051_actual77_79_reissue_same_up_after_synthetic_lead_in',
              'test_required_test052_startup_flickers_and_strict_parity',
              'test_required_test052_three_flickers_before_initial_publication',
              'test_required_test053_original_reference_after_reissue',
              'test_required_test053_reference_motion_and_strict_parity',
              'test_required_test054_latest_route_and_strict_parity',
              'test_required_test056_original_floor_labels_and_strict_parity',
              'test_required_test056_floor_stability_and_three_recorded_moves',
              'test_required_test057_actual055_classification_and_original_down_motion',
              'test_required_test057_actual053_identical_tiles_keep_original_authority',
              'test_required_test057_original_partial_checkpoint_and_strict_parity',
              'test_required_test057_recorded_right_and_pending_up',
              'test_required_test057_partial_checkpoint_is_not_complete_export',
              'test_required_test058_original_complete_capture_and_strict_parity',
              'test_required_test058_recorded_two_left_and_unexecuted_down',
              'test_required_test058_complete_recording_is_not_goods_acceptance',
              'test_required_test059_original_partial_capture_and_strict_parity',
              'test_required_test059_recorded_three_up_and_unexecuted_fourth',
              'test_required_test059_incomplete_two_run_recording_is_unknown',
              'test_required_test054_recorded_failure_is_not_game_success',
          }
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              'test_native_perception', 'test_native_navigation',
              'test_native_beat', 'test_native_controller',
              'test_native_raster', 'test_device_recording', 'test_native_goal_world',
          ])
          def flatten(node):
              for item in node:
                  if isinstance(item, unittest.TestSuite):
                      yield from flatten(item)
                  else:
                      yield item
          selected, excluded = [], set()
          for case in flatten(suite):
              name = case.id().rsplit('.', 1)[-1]
              if name in fixture_cases:
                  excluded.add(name)
              else:
                  selected.append(case)
          if excluded != fixture_cases:
              raise RuntimeError('required private replay case list changed: ' + repr(excluded))
          print('CI excludes these required local private-image replays:', sorted(excluded), flush=True)
          result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(selected))
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit(1)
          PY
      - name: Verify TEST059 fixed old Red, current Green and rollback Red
        run: |
          "$RUNNER_TEMP/ngg2-host-venv/bin/python" patches/loopctrl/check_next_slot.py "$RUNNER_TEMP/test059-next-slot"
      - name: Verify TEST060 fixed old Red, current Green and three rollback faults
        run: |
          "$RUNNER_TEMP/ngg2-host-venv/bin/python" patches/loopctrl/check_continuous_admission.py "$RUNNER_TEMP/test060-continuous-admission"
      - name: Save native host diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: loopctrl-ngg2-native-host
          path: |
            ${{ runner.temp }}/ngg2-native-host.txt
            ${{ runner.temp }}/test059-next-slot/*.json
            ${{ runner.temp }}/test059-next-slot/*.txt
            ${{ runner.temp }}/test060-continuous-admission/*.json
            ${{ runner.temp }}/test060-continuous-admission/*.txt
            ${{ runner.temp }}/test060-world/*.json
            ${{ runner.temp }}/test060-world/*.txt
          if-no-files-found: error
          retention-days: 30
  test061-host-contracts:
    needs: native-source-ready
    if: inputs.native_lane == 'device' || inputs.native_lane == 'focused' || (inputs.native_lane == 'full' && needs.native-source-ready.outputs.ready == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: driver
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Souitou-iop/LoopCtrl
          ref: 6e25cf6a9f65bc86c372cdce94bdb151d0cf6767
          path: upstream
          persist-credentials: false
      - name: Install existing image-test dependency in an isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/test061-host-venv"
          "$RUNNER_TEMP/test061-host-venv/bin/pip" install Pillow==11.3.0
      - name: Apply exact sealed native source and run selected host contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f driver/patches/loopctrl/ngg2-manifest.json
          mkdir -p "$RUNNER_TEMP/test061-host"
          python3 driver/patches/loopctrl/apply_patch.py upstream
          python3 driver/patches/loopctrl/apply_ngg2.py upstream
          NATIVE_HOST_RUNNER=driver/patches/loopctrl/run_test061_host.py
          if [ "${{ inputs.native_lane }}" = device ]; then
            NATIVE_HOST_RUNNER=driver/patches/loopctrl/run_test062_host.py
          fi
          "$RUNNER_TEMP/test061-host-venv/bin/python" "$NATIVE_HOST_RUNNER" driver upstream "$RUNNER_TEMP/test061-host" 2>&1 | tee "$RUNNER_TEMP/test061-host/host-command.txt"
      - name: Save selected host evidence and explicit test inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: loopctrl-ngg2-native-host
          path: ${{ runner.temp }}/test061-host/
          if-no-files-found: error
          retention-days: 30
  focused-build:
    needs: [native-source-ready, test061-host-contracts]
    if: (inputs.native_lane == 'device' || inputs.native_lane == 'focused') && needs.native-source-ready.outputs.ready == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: driver
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Souitou-iop/LoopCtrl
          ref: 6e25cf6a9f65bc86c372cdce94bdb151d0cf6767
          path: upstream
          persist-credentials: false
      - name: Apply guarded source and seal used for selected validation and IPA
        run: |
          python3 driver/patches/loopctrl/apply_patch.py upstream
          python3 driver/patches/loopctrl/apply_ngg2.py upstream
      - name: Install build tools
        run: |
          brew install xcodegen
          rustup target add aarch64-apple-ios
          xcodebuild -version
          rustc --version
      - name: Generate and inspect actual source-specific project configuration
        run: |
          (cd upstream && xcodegen generate --spec project.yml)
          python3 driver/patches/loopctrl/check_perception_build.py --project upstream "$RUNNER_TEMP/ngg2/perception-build"
      - name: Run actual Runtime TEST061 public integration fixtures
        if: inputs.native_lane != 'device'
        run: python3 driver/patches/loopctrl/check_ngg2.py --test061-public-only upstream "$RUNNER_TEMP/test061-runtime"
      - name: Detect TEST061 boundary rollback faults
        if: inputs.native_lane != 'device'
        run: python3 driver/patches/loopctrl/check_ngg2.py --test061-new-mutations-only upstream "$RUNNER_TEMP/test061-faults"
      - name: Run independent actual Runtime shop world16 endpoint
        if: inputs.native_lane != 'device'
        run: python3 driver/patches/loopctrl/check_ngg2.py --test058-shop-only upstream "$RUNNER_TEMP/test058-shop"
      - name: Run actual LoopCtrlKit API and capability contracts
        if: inputs.native_lane != 'device'
        working-directory: upstream
        run: |
          set -euo pipefail
          xcodebuild test -project LoopCtrl.xcodeproj -scheme LoopCtrlKitTests -destination platform=macOS -quiet 2>&1 | tee "$RUNNER_TEMP/ngg2/loopctrlkit-tests.txt"
      - name: Configure unsigned build
        working-directory: upstream
        run: |
          mkdir -p Config
          printf '// CI: unsigned build, no team.\nDEVELOPMENT_TEAM =\n' > Config/Local.xcconfig
      - name: Build and package unsigned IPA
        working-directory: upstream
        run: |
          set -euo pipefail
          make ipa UNSIGNED=1 EXTRA_BUILD_SETTINGS="CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER" 2>&1 | tee "$RUNNER_TEMP/ngg2/ios-build.txt"
          Scripts/package-release.sh 2>&1 | tee "$RUNNER_TEMP/ngg2/ios-package.txt"
      - name: Preserve actual compiler inputs for verification diagnostics
        if: always()
        env:
          NATIVE_ARG_PROOF: ${{ runner.temp }}/ngg2/perception-build/raw-build-args
        run: |
          python3 - <<'PYPROOF'
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('profile_reader', 'driver/patches/loopctrl/check_perception_build.py')
          reader = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(reader)
          upstream = Path('upstream').resolve()
          output = Path(os.environ['NATIVE_ARG_PROOF'])
          output.mkdir(parents=True, exist_ok=True)
          snapshot = {'format_version': 1, 'responses': [], 'errors': [], 'truncated': False}
          budget = 0
          build = upstream / 'build'
          for path in sorted(build.rglob('*')) if build.is_dir() else []:
              if path.is_symlink() or not path.is_file() or not (path.suffix == '.resp' or path.name.endswith('.SwiftFileList')):
                  continue
              if len(snapshot['responses']) >= 256 or path.stat().st_size > 2*1024*1024 or budget + path.stat().st_size > 8*1024*1024:
                  snapshot['truncated'] = True
                  continue
              try:
                  _, records = reader.expand_response_args(['@'+str(path)], upstream, output)
                  snapshot['responses'].extend(records)
                  budget += sum(record['bytes'] for record in records)
              except reader.ProfileError as error:
                  snapshot['errors'].append({'path': path.relative_to(upstream).as_posix(), 'code': str(error)})
          project = upstream / 'LoopCtrl.xcodeproj/project.pbxproj'
          if project.is_file() and not project.is_symlink():
              raw = project.read_bytes()
              (output/'project.pbxproj').write_bytes(raw)
              snapshot['project_sha256'] = hashlib.sha256(raw).hexdigest()
              (output/'project-model.json').write_text(json.dumps(reader.read_project(project), indent=2)+'\n')
          (output/'snapshot.json').write_text(json.dumps(snapshot, indent=2)+'\n')
          PYPROOF
      - name: Verify actual source-specific Perception compiler profile
        run: python3 driver/patches/loopctrl/check_perception_build.py --compile-profile upstream "$RUNNER_TEMP/ngg2/ios-build.txt" "$RUNNER_TEMP/ngg2/perception-build"
      - name: Verify package and record provenance
        run: python3 driver/patches/loopctrl/verify_package.py upstream driver upstream/release/LoopCtrl.ipa
      - name: Save unsigned IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: loopctrl-ngg2-unsigned
          path: |
            upstream/release/LoopCtrl.ipa
            upstream/release/SHA256SUMS.txt
            upstream/release/build-manifest.json
            upstream/release/native-perception-profile.json
            upstream/LoopCtrl.xcodeproj/project.pbxproj
            upstream/LICENSE
            upstream/NOTICE.md
            driver/patches/loopctrl/NOTICE-LoopCtrl.md
            upstream/LoopCtrlUITests/ActionCommand.swift
            upstream/LoopCtrlUITests/ActionHandler.swift
            upstream/LoopCtrlKit/RPCMethod.swift
            upstream/LoopCtrlUITests/LoopCtrlUITests.swift
            upstream/LoopCtrlUITests/ScreenStream.swift
            upstream/LoopCtrlUITests/ObjCException.m
            upstream/LoopCtrlUITests/XCTestPrivate-Bridging-Header.h
            upstream/LoopCtrlUITests/NG2*
            upstream/Tests/LoopCtrlKitTests/NG2RPCContractsTests.swift
            upstream/project.yml
            upstream/LoopCtrlKit/JSONRPCServer.swift
            upstream/LoopCtrlKit/RemoteSession.swift
            driver/patches/loopctrl/ngg2-manifest.json
            driver/patches/loopctrl/ngg2_runtime_scene_fixtures.c
            driver/patches/loopctrl/ngg2_runtime_scene_fixtures.h
          if-no-files-found: error
          retention-days: 30
      - name: Save test and build diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: loopctrl-ngg2-validation
          path: |
            ${{ runner.temp }}/test061-runtime/
            ${{ runner.temp }}/test061-faults/
            ${{ runner.temp }}/test058-shop/
            ${{ runner.temp }}/ngg2/*.json
            ${{ runner.temp }}/ngg2/*.txt
            ${{ runner.temp }}/ngg2/perception-build/
          if-no-files-found: error
          retention-days: 30
  build:
    needs: [native-source-ready, native-host-contracts, test061-host-contracts]
    if: inputs.native_lane == 'full' && needs.native-source-ready.outputs.ready == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: driver
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Souitou-iop/LoopCtrl
          ref: 6e25cf6a9f65bc86c372cdce94bdb151d0cf6767
          path: upstream
          persist-credentials: false
      - name: Observe original dimension contract Red
        run: |
          swiftc --version
          python3 driver/patches/loopctrl/check_baseline.py upstream "$RUNNER_TEMP/geometry-baseline"
      - name: Test patch application and package validation
        run: python3 -m unittest discover -s driver/patches/loopctrl -p 'test_*.py' -v
      - name: Apply guarded source patch and run Swift contracts
        run: |
          python3 driver/patches/loopctrl/apply_patch.py upstream
          python3 driver/patches/loopctrl/check_geometry.py upstream "$RUNNER_TEMP/geometry-ngg1"
      - name: Apply sealed native source and verify generated Perception configuration
        run: |
          python3 driver/patches/loopctrl/apply_ngg2.py upstream
          brew install xcodegen
          (cd upstream && xcodegen generate --spec project.yml)
          python3 driver/patches/loopctrl/check_perception_build.py --project upstream "$RUNNER_TEMP/ngg2/perception-build"
      - name: Observe fixed TEST057 dispatch preparation assertion Red
        run: python3 driver/patches/loopctrl/check_ngg2.py --test058-red-only upstream "$RUNNER_TEMP/test058-baseline"
      - name: Run actual Runtime TEST061 public integration fixtures
        run: python3 driver/patches/loopctrl/check_ngg2.py --test061-public-only upstream "$RUNNER_TEMP/test061-runtime"
      - name: Detect TEST061 boundary rollback faults
        run: python3 driver/patches/loopctrl/check_ngg2.py --test061-new-mutations-only upstream "$RUNNER_TEMP/test061-faults"
      - name: Run qualified TEST058 preparation deadline contract
        run: python3 driver/patches/loopctrl/check_ngg2.py --test058-public-only upstream "$RUNNER_TEMP/test058-preparation"
      - name: Detect TEST058 preparation reuse and diagnostic priority faults
        run: python3 driver/patches/loopctrl/check_ngg2.py --test058-new-mutations-only upstream "$RUNNER_TEMP/test058-faults"
      - name: Run independent TEST058 shop world16 contract
        run: python3 driver/patches/loopctrl/check_ngg2.py --test058-shop-only upstream "$RUNNER_TEMP/test058-shop"
      - name: Observe fixed TEST055 stop-evidence retention assertion Red
        run: python3 driver/patches/loopctrl/check_ngg2.py --test056-red-only upstream "$RUNNER_TEMP/test056-baseline"
      - name: Run production Swift native contracts using the declared per-source profile
        run: python3 driver/patches/loopctrl/check_ngg2.py upstream "$RUNNER_TEMP/ngg2"
      - name: Run existing LoopCtrlKit tests
        working-directory: upstream
        run: |
          set -euo pipefail
          xcodebuild test -project LoopCtrl.xcodeproj -scheme LoopCtrlKitTests -destination platform=macOS -quiet 2>&1 | tee "$RUNNER_TEMP/ngg2/loopctrlkit-tests.txt"
      - name: Observe actual encrypted RPC owner-callsite mutation Red
        run: python3 driver/patches/loopctrl/check_ngg2_rpc.py upstream "$RUNNER_TEMP/ngg2"
      - name: Install build tools
        run: |
          brew install xcodegen
          rustup target add aarch64-apple-ios
          xcodebuild -version
          rustc --version
      - name: Configure unsigned build
        working-directory: upstream
        run: |
          mkdir -p Config
          printf '// CI: unsigned build, no team.\nDEVELOPMENT_TEAM =\n' > Config/Local.xcconfig
      - name: Build and package unsigned IPA
        working-directory: upstream
        run: |
          set -euo pipefail
          make ipa UNSIGNED=1 EXTRA_BUILD_SETTINGS="CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER" 2>&1 | tee "$RUNNER_TEMP/ngg2/ios-build.txt"
          Scripts/package-release.sh 2>&1 | tee "$RUNNER_TEMP/ngg2/ios-package.txt"
      - name: Preserve actual compiler inputs for verification diagnostics
        if: always()
        env:
          NATIVE_ARG_PROOF: ${{ runner.temp }}/ngg2/perception-build/raw-build-args
        run: |
          python3 - <<'PYPROOF'
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('profile_reader', 'driver/patches/loopctrl/check_perception_build.py')
          reader = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(reader)
          upstream = Path('upstream').resolve()
          output = Path(os.environ['NATIVE_ARG_PROOF'])
          output.mkdir(parents=True, exist_ok=True)
          snapshot = {'format_version': 1, 'responses': [], 'errors': [], 'truncated': False}
          budget = 0
          build = upstream / 'build'
          for path in sorted(build.rglob('*')) if build.is_dir() else []:
              if path.is_symlink() or not path.is_file() or not (path.suffix == '.resp' or path.name.endswith('.SwiftFileList')):
                  continue
              if len(snapshot['responses']) >= 256 or path.stat().st_size > 2*1024*1024 or budget + path.stat().st_size > 8*1024*1024:
                  snapshot['truncated'] = True
                  continue
              try:
                  _, records = reader.expand_response_args(['@'+str(path)], upstream, output)
                  snapshot['responses'].extend(records)
                  budget += sum(record['bytes'] for record in records)
              except reader.ProfileError as error:
                  snapshot['errors'].append({'path': path.relative_to(upstream).as_posix(), 'code': str(error)})
          project = upstream / 'LoopCtrl.xcodeproj/project.pbxproj'
          if project.is_file() and not project.is_symlink():
              raw = project.read_bytes()
              (output/'project.pbxproj').write_bytes(raw)
              snapshot['project_sha256'] = hashlib.sha256(raw).hexdigest()
              (output/'project-model.json').write_text(json.dumps(reader.read_project(project), indent=2)+'\n')
          (output/'snapshot.json').write_text(json.dumps(snapshot, indent=2)+'\n')
          PYPROOF
      - name: Verify actual source-specific Perception compiler profile
        run: python3 driver/patches/loopctrl/check_perception_build.py --compile-profile upstream "$RUNNER_TEMP/ngg2/ios-build.txt" "$RUNNER_TEMP/ngg2/perception-build"
      - name: Verify package and record provenance
        run: python3 driver/patches/loopctrl/verify_package.py upstream driver upstream/release/LoopCtrl.ipa
      - name: Save unsigned IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: loopctrl-ngg2-unsigned
          path: |
            upstream/release/LoopCtrl.ipa
            upstream/release/SHA256SUMS.txt
            upstream/release/build-manifest.json
            upstream/release/native-perception-profile.json
            upstream/LoopCtrl.xcodeproj/project.pbxproj
            upstream/LICENSE
            upstream/NOTICE.md
            driver/patches/loopctrl/NOTICE-LoopCtrl.md
            upstream/LoopCtrlUITests/ActionCommand.swift
            upstream/LoopCtrlUITests/ActionHandler.swift
            upstream/LoopCtrlKit/RPCMethod.swift
            upstream/LoopCtrlUITests/LoopCtrlUITests.swift
            upstream/LoopCtrlUITests/ScreenStream.swift
            upstream/LoopCtrlUITests/ObjCException.m
            upstream/LoopCtrlUITests/XCTestPrivate-Bridging-Header.h
            upstream/LoopCtrlUITests/NG2*
            upstream/Tests/LoopCtrlKitTests/NG2RPCContractsTests.swift
            upstream/project.yml
            upstream/LoopCtrlKit/JSONRPCServer.swift
            upstream/LoopCtrlKit/RemoteSession.swift
            driver/patches/loopctrl/ngg2-manifest.json
            driver/patches/loopctrl/ngg2_runtime_scene_fixtures.c
            driver/patches/loopctrl/ngg2_runtime_scene_fixtures.h
          if-no-files-found: error
          retention-days: 30
      - name: Save test and build diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: loopctrl-ngg2-validation
          path: |
            ${{ runner.temp }}/test061-runtime/
            ${{ runner.temp }}/test061-faults/
            ${{ runner.temp }}/geometry-baseline/*.json
            ${{ runner.temp }}/geometry-baseline/*.txt
            ${{ runner.temp }}/geometry-ngg1/*.json
            ${{ runner.temp }}/geometry-ngg1/*.txt
            ${{ runner.temp }}/test058-baseline/*.json
            ${{ runner.temp }}/test058-baseline/*.txt
            ${{ runner.temp }}/test058-preparation/*.json
            ${{ runner.temp }}/test058-preparation/*.txt
            ${{ runner.temp }}/test058-faults/*.json
            ${{ runner.temp }}/test058-faults/*.txt
            ${{ runner.temp }}/test058-shop/*.json
            ${{ runner.temp }}/test058-shop/*.txt
            ${{ runner.temp }}/test056-baseline/*.json
            ${{ runner.temp }}/test056-baseline/*.txt
            ${{ runner.temp }}/ngg2/*.json
            ${{ runner.temp }}/ngg2/*.txt
            ${{ runner.temp }}/ngg2/perception-build/
          if-no-files-found: error
          retention-days: 30
  publish-download:
    if: inputs.native_lane == 'publish-download'
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: shuhei0720/necrogold-automation
      GH_HOST: github.com
      DOWNLOAD_ARTIFACT_ID: ${{ inputs.artifact_id }}
      DOWNLOAD_ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
      DOWNLOAD_IPA_SHA256: ${{ inputs.ipa_sha256 }}
      DOWNLOAD_SOURCE_COMMIT: ${{ inputs.source_commit }}
      DOWNLOAD_SOURCE_SHA256: ${{ inputs.source_sha256 }}
      DOWNLOAD_RELEASE_ID: ${{ inputs.release_id }}
      DOWNLOAD_RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Validate inputs and publish only the verified package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import zipfile

          REPO = 'shuhei0720/necrogold-automation'
          FILES = ('LoopCtrl.ipa', 'source.zip', 'SHA256SUMS.txt')
          ENV_FIELDS = {key: 'DOWNLOAD_'+key.upper() for key in (
              'artifact_id', 'archive_sha256', 'ipa_sha256', 'source_commit',
              'source_sha256', 'release_id', 'release_tag')}


          def require(value, message):
              if not value:
                  raise ValueError(message)


          def validated_inputs(environ):
              spec = {key: environ.get(name, '') for key, name in ENV_FIELDS.items()}
              for key, value in spec.items():
                  require(type(value) is str, 'invalid input: '+key)
                  if key in ('artifact_id', 'release_id'):
                      valid = bool(re.fullmatch(r'[1-9][0-9]{0,18}', value)) and int(value) < 2**63
                  elif key.endswith('_sha256'):
                      valid = bool(re.fullmatch(r'[0-9a-f]{64}', value))
                  elif key == 'source_commit':
                      valid = bool(re.fullmatch(r'[0-9a-f]{40}', value))
                  else:
                      valid = bool(re.fullmatch(r'test[0-9]{3}-build[1-9][0-9]{0,18}', value))
                  require(valid, 'invalid input: '+key)
              return spec


          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()


          def verify_draft(release, spec):
              require(type(release) is dict and type(release.get('id')) is int
                      and release['id'] == int(spec['release_id']) and release.get('draft') is True
                      and release.get('tag_name') == spec['release_tag']
                      and release.get('target_commitish') == spec['source_commit'], 'draft ownership mismatch')
              require(type(release.get('assets')) is list and not release['assets'], 'draft must have no assets')


          def api_release(spec):
              result = subprocess.run(['gh', 'api', 'repos/'+REPO+'/releases/'+spec['release_id']],
                                      check=True, capture_output=True, text=True)
              return json.loads(result.stdout)


          def publish(environ=None):
              # Validate every caller-controlled value before filesystem work or network.
              spec = validated_inputs(os.environ if environ is None else environ)
              directory = Path(os.environ['RUNNER_TEMP'])/'verified-download'
              directory.mkdir()
              archive = directory/'build-artifact.zip'
              with archive.open('wb') as output:
                  subprocess.run(['gh', 'api', 'repos/'+REPO+'/actions/artifacts/'+spec['artifact_id']+'/zip'],
                                 check=True, stdout=output)
              require(digest(archive) == spec['archive_sha256'], 'artifact archive SHA mismatch')
              with zipfile.ZipFile(archive) as package:
                  require(len(package.namelist()) == len(set(package.namelist())) and package.testzip() is None,
                          'artifact ZIP integrity failure')
                  item = package.getinfo('upstream/release/LoopCtrl.ipa')
                  require(0 < item.file_size <= 128*1024*1024 and not item.is_dir(), 'invalid IPA entry')
                  (directory/FILES[0]).write_bytes(package.read(item))
              require(digest(directory/FILES[0]) == spec['ipa_sha256'], 'IPA SHA mismatch')
              subprocess.run(['curl', '--fail', '--location', '--silent', '--show-error',
                              'https://codeload.github.com/'+REPO+'/zip/'+spec['source_commit'],
                              '--output', str(directory/FILES[1])], check=True)
              require(digest(directory/FILES[1]) == spec['source_sha256'], 'source ZIP SHA mismatch')
              (directory/FILES[2]).write_text(spec['ipa_sha256']+'  '+FILES[0]+'\n'
                                            +spec['source_sha256']+'  '+FILES[1]+'\n')
              verify_draft(api_release(spec), spec)
              subprocess.run(['gh', 'release', 'upload', spec['release_tag'], *FILES, '--repo', REPO],
                             cwd=directory, check=True)
              uploaded = api_release(spec)
              identity = dict(uploaded); identity['assets'] = []
              verify_draft(identity, spec)
              expected = {name: 'sha256:'+digest(directory/name) for name in FILES}
              assets = uploaded.get('assets')
              require(type(assets) is list and len(assets) == len(FILES)
                      and {row['name']: row.get('digest') for row in assets} == expected,
                      'uploaded asset inventory/digest mismatch')
              subprocess.run(['gh', 'release', 'edit', spec['release_tag'], '--draft=false', '--prerelease',
                              '--latest=false', '--repo', REPO], check=True)
              final = api_release(spec)
              require(final.get('draft') is False and final.get('tag_name') == spec['release_tag']
                      and final.get('target_commitish') == spec['source_commit'], 'published release identity mismatch')
              print(json.dumps({'url': final['html_url'], 'draft': final['draft'],
                                'assets': [{'name': a['name'], 'size': a['size'], 'digest': a.get('digest'),
                                            'url': a['browser_download_url']} for a in final['assets']]}, indent=2))


          if __name__ == '__main__':
              publish()
          PY
