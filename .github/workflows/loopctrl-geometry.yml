name: LoopCtrl native control and geometry

on:
  push:
    branches: [work/p1-capture-probe]
    paths:
      - 'patches/loopctrl/**'
      - '.github/workflows/loopctrl-geometry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-contract-red:
    needs: native-source-ready
    if: needs.native-source-ready.outputs.ready != 'true'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: driver
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Souitou-iop/LoopCtrl
          ref: 6e25cf6a9f65bc86c372cdce94bdb151d0cf6767
          path: upstream
          persist-credentials: false
      - name: Run all TEST051 Runtime public contracts and 48 callsite mutants
        run: |
          python3 driver/patches/loopctrl/check_ngg2.py --test051-runtime-only upstream "$RUNNER_TEMP/ngg2-baseline"
      - name: Save native baseline diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: loopctrl-ngg2-baseline
          path: ${{ runner.temp }}/ngg2-baseline/
          if-no-files-found: error
          retention-days: 30
  native-source-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.manifest.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: manifest
        name: Require a sealed native source manifest for IPA builds
        shell: bash
        run: |
          if test -f patches/loopctrl/ngg2-manifest.json; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
  native-host-contracts:
    needs: native-source-ready
    if: needs.native-source-ready.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the existing image-test dependency in an isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/ngg2-host-venv"
          "$RUNNER_TEMP/ngg2-host-venv/bin/pip" install Pillow==11.3.0
      - name: Run native algorithm contracts without private image fixtures
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_TEMP/ngg2-no-private-fixtures"
          NECRO_TEST043_FIXTURE_ROOT="$RUNNER_TEMP/ngg2-no-private-fixtures" "$RUNNER_TEMP/ngg2-host-venv/bin/python" - <<'PY' 2>&1 | tee "$RUNNER_TEMP/ngg2-native-host.txt"
          import sys
          import unittest
          from pathlib import Path
          sys.path.insert(0, str(Path('tests').resolve()))
          fixture_cases = {
              'test_known_floor_public_entry', 'test_required_known_image_parity',
              'test_padding_ignored', 'test_sanitized_real_images_and_buffer_boundaries',
              'test_required034_to042_route_motion_and_all73_score_parity',
              'test_actual037_single_partial_gold_step_retains_stone_evidence',
              'test_required_test045_subtile_motion_replay',
              'test_required_test046_capture_replay',
              'test_required_test048_strict_optimization_parity',
              'test_required_test049_navigation_strict_optimization_parity',
          }
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              'test_native_perception', 'test_native_navigation',
              'test_native_beat', 'test_native_controller',
              'test_native_raster',
          ])
          def flatten(node):
              for item in node:
                  if isinstance(item, unittest.TestSuite):
                      yield from flatten(item)
                  else:
                      yield item
          selected, excluded = [], set()
          for case in flatten(suite):
              name = case.id().rsplit('.', 1)[-1]
              if name in fixture_cases:
                  excluded.add(name)
              else:
                  selected.append(case)
          if excluded != fixture_cases:
              raise RuntimeError('required private replay case list changed: ' + repr(excluded))
          print('CI excludes these required local private-image replays:', sorted(excluded), flush=True)
          result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(selected))
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit(1)
          PY
      - name: Save native host diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: loopctrl-ngg2-native-host
          path: ${{ runner.temp }}/ngg2-native-host.txt
          if-no-files-found: error
          retention-days: 30
  build:
    needs: [native-source-ready, native-host-contracts]
    if: needs.native-source-ready.outputs.ready == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: driver
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Souitou-iop/LoopCtrl
          ref: 6e25cf6a9f65bc86c372cdce94bdb151d0cf6767
          path: upstream
          persist-credentials: false
      - name: Observe original dimension contract Red
        run: |
          swiftc --version
          python3 driver/patches/loopctrl/check_baseline.py upstream "$RUNNER_TEMP/geometry-baseline"
      - name: Test patch application and package validation
        run: python3 -m unittest discover -s driver/patches/loopctrl -p 'test_*.py' -v
      - name: Apply guarded source patch and run Swift contracts
        run: |
          python3 driver/patches/loopctrl/apply_patch.py upstream
          python3 driver/patches/loopctrl/check_geometry.py upstream "$RUNNER_TEMP/geometry-ngg1"
      - name: Apply sealed native source and verify generated Perception configuration
        run: |
          python3 driver/patches/loopctrl/apply_ngg2.py upstream
          brew install xcodegen
          (cd upstream && xcodegen generate --spec project.yml)
          python3 driver/patches/loopctrl/check_perception_build.py --project upstream "$RUNNER_TEMP/ngg2/perception-build"
      - name: Install build tools
        run: |
          brew install xcodegen
          rustup target add aarch64-apple-ios
          xcodebuild -version
          rustc --version
      - name: Configure unsigned build
        working-directory: upstream
        run: |
          mkdir -p Config
          printf '// CI: unsigned build, no team.\nDEVELOPMENT_TEAM =\n' > Config/Local.xcconfig
      - name: Build and package unsigned IPA
        working-directory: upstream
        run: |
          set -euo pipefail
          make ipa UNSIGNED=1 EXTRA_BUILD_SETTINGS="CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER" 2>&1 | tee "$RUNNER_TEMP/ngg2/ios-build.txt"
          Scripts/package-release.sh 2>&1 | tee "$RUNNER_TEMP/ngg2/ios-package.txt"
      - name: Preserve actual compiler inputs for verification diagnostics
        if: always()
        env:
          NATIVE_ARG_PROOF: ${{ runner.temp }}/ngg2/perception-build/raw-build-args
        run: |
          python3 - <<'PYPROOF'
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('profile_reader', 'driver/patches/loopctrl/check_perception_build.py')
          reader = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(reader)
          upstream = Path('upstream').resolve()
          output = Path(os.environ['NATIVE_ARG_PROOF'])
          output.mkdir(parents=True, exist_ok=True)
          snapshot = {'format_version': 1, 'responses': [], 'errors': [], 'truncated': False}
          budget = 0
          build = upstream / 'build'
          for path in sorted(build.rglob('*')) if build.is_dir() else []:
              if path.is_symlink() or not path.is_file() or not (path.suffix == '.resp' or path.name.endswith('.SwiftFileList')):
                  continue
              if len(snapshot['responses']) >= 256 or path.stat().st_size > 2*1024*1024 or budget + path.stat().st_size > 8*1024*1024:
                  snapshot['truncated'] = True
                  continue
              try:
                  _, records = reader.expand_response_args(['@'+str(path)], upstream, output)
                  snapshot['responses'].extend(records)
                  budget += sum(record['bytes'] for record in records)
              except reader.ProfileError as error:
                  snapshot['errors'].append({'path': path.relative_to(upstream).as_posix(), 'code': str(error)})
          project = upstream / 'LoopCtrl.xcodeproj/project.pbxproj'
          if project.is_file() and not project.is_symlink():
              raw = project.read_bytes()
              (output/'project.pbxproj').write_bytes(raw)
              snapshot['project_sha256'] = hashlib.sha256(raw).hexdigest()
              (output/'project-model.json').write_text(json.dumps(reader.read_project(project), indent=2)+'\n')
          (output/'snapshot.json').write_text(json.dumps(snapshot, indent=2)+'\n')
          PYPROOF
      - name: Verify actual source-specific Perception compiler profile
        run: python3 driver/patches/loopctrl/check_perception_build.py --compile-profile upstream "$RUNNER_TEMP/ngg2/ios-build.txt" "$RUNNER_TEMP/ngg2/perception-build"
      - name: Run production Swift native contracts with the verified build profile
        run: python3 driver/patches/loopctrl/check_ngg2.py upstream "$RUNNER_TEMP/ngg2"
      - name: Run existing LoopCtrlKit tests
        working-directory: upstream
        run: |
          set -euo pipefail
          xcodebuild test -project LoopCtrl.xcodeproj -scheme LoopCtrlKitTests -destination platform=macOS -quiet 2>&1 | tee "$RUNNER_TEMP/ngg2/loopctrlkit-tests.txt"
      - name: Observe actual encrypted RPC owner-callsite mutation Red
        run: python3 driver/patches/loopctrl/check_ngg2_rpc.py upstream "$RUNNER_TEMP/ngg2"
      - name: Verify package and record provenance
        run: python3 driver/patches/loopctrl/verify_package.py upstream driver upstream/release/LoopCtrl.ipa
      - name: Save unsigned IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: loopctrl-ngg2-unsigned
          path: |
            upstream/release/LoopCtrl.ipa
            upstream/release/SHA256SUMS.txt
            upstream/release/build-manifest.json
            upstream/release/native-perception-profile.json
            upstream/LoopCtrl.xcodeproj/project.pbxproj
            upstream/LICENSE
            upstream/NOTICE.md
            driver/patches/loopctrl/NOTICE-LoopCtrl.md
            upstream/LoopCtrlUITests/ActionCommand.swift
            upstream/LoopCtrlUITests/ActionHandler.swift
            upstream/LoopCtrlKit/RPCMethod.swift
            upstream/LoopCtrlUITests/LoopCtrlUITests.swift
            upstream/LoopCtrlUITests/ScreenStream.swift
            upstream/LoopCtrlUITests/ObjCException.m
            upstream/LoopCtrlUITests/XCTestPrivate-Bridging-Header.h
            upstream/LoopCtrlUITests/NG2*
            upstream/Tests/LoopCtrlKitTests/NG2RPCContractsTests.swift
            upstream/project.yml
            upstream/LoopCtrlKit/JSONRPCServer.swift
            upstream/LoopCtrlKit/RemoteSession.swift
            driver/patches/loopctrl/ngg2-manifest.json
            driver/patches/loopctrl/ngg2_runtime_scene_fixtures.c
            driver/patches/loopctrl/ngg2_runtime_scene_fixtures.h
          if-no-files-found: error
          retention-days: 30
      - name: Save test and build diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: loopctrl-ngg2-validation
          path: |
            ${{ runner.temp }}/geometry-baseline/*.json
            ${{ runner.temp }}/geometry-baseline/*.txt
            ${{ runner.temp }}/geometry-ngg1/*.json
            ${{ runner.temp }}/geometry-ngg1/*.txt
            ${{ runner.temp }}/ngg2/*.json
            ${{ runner.temp }}/ngg2/*.txt
            ${{ runner.temp }}/ngg2/perception-build/
          if-no-files-found: error
          retention-days: 30
