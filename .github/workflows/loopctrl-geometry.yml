  focused-build:
    needs: [native-source-ready, test061-host-contracts]
    if: (inputs.native_lane == 'device' || inputs.native_lane == 'focused') && needs.native-source-ready.outputs.ready == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: driver
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Souitou-iop/LoopCtrl
          ref: 6e25cf6a9f65bc86c372cdce94bdb151d0cf6767
          path: upstream
          persist-credentials: false
      - name: Apply guarded source and seal used for selected validation and IPA
        run: |
          python3 driver/patches/loopctrl/apply_patch.py upstream
          python3 driver/patches/loopctrl/apply_ngg2.py upstream
      - name: Install build tools
        run: |
          brew install xcodegen
          rustup target add aarch64-apple-ios
          xcodebuild -version
          rustc --version
      - name: Install TEST094 focused Swift fixture image decoder
        id: cycle_fixture_env
        if: inputs.native_lane == 'device' && contains(fromJSON('["094","095","096","097","098","099"]'), needs.test061-host-contracts.outputs.device_profile)
        run: |
          python3 -m venv "$RUNNER_TEMP/test094-mac-venv"
          "$RUNNER_TEMP/test094-mac-venv/bin/pip" install Pillow==11.3.0
      - name: Verify TEST094 actual authenticated owner and public cycle schema
        if: inputs.native_lane == 'device' && !cancelled() && steps.cycle_fixture_env.outcome == 'success' && contains(fromJSON('["094","095","096","097","098","099"]'), needs.test061-host-contracts.outputs.device_profile)
        run: '"$RUNNER_TEMP/test094-mac-venv/bin/python" driver/patches/loopctrl/check_cycle_api094.py upstream "$RUNNER_TEMP/test094-api" --fault-red'
      - name: Verify TEST094 immutable spool and actual filesystem fault boundaries
        if: inputs.native_lane == 'device' && !cancelled() && steps.cycle_fixture_env.outcome == 'success' && contains(fromJSON('["094","095","096","097","098","099"]'), needs.test061-host-contracts.outputs.device_profile)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/test094-spool"
          "$RUNNER_TEMP/test094-mac-venv/bin/python" driver/patches/loopctrl/check_cycle_spool094.py --fault-red 2>&1 | tee "$RUNNER_TEMP/test094-spool/spool-command.txt"
      - name: Verify TEST094 immutable terminal export and exact image roundtrip
        if: inputs.native_lane == 'device' && !cancelled() && steps.cycle_fixture_env.outcome == 'success' && contains(fromJSON('["094","095","096","097","098","099"]'), needs.test061-host-contracts.outputs.device_profile)
        run: '"$RUNNER_TEMP/test094-mac-venv/bin/python" driver/patches/loopctrl/check_cycle_export094.py upstream "$RUNNER_TEMP/test094-export" --fault-red'
      - name: Verify TEST094 selected actual Runtime cycle callbacks
        # TEST096/097/098 replace the obsolete PAUSE-before-classifier release fixture.
        # The replacement retains the old intent/cancellation assertions.
        if: inputs.native_lane == 'device' && !cancelled() && steps.cycle_fixture_env.outcome == 'success' && contains(fromJSON('["094","095"]'), needs.test061-host-contracts.outputs.device_profile)
