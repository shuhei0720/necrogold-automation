name: LoopCtrl native control and geometry

on:
  workflow_dispatch:
    inputs:
      native_lane:
        description: Rapid device units and IPA; focused/full synthetic validation remains explicit
        type: choice
        required: true
        default: device
        options: [device, focused, full, publish-download, test058-red, test058-quick, test081-retention-red, test099-runtime-red, test099-runtime-diagnostic, test099-runtime-remaining, test100-runtime-partial, test101-runtime-observation, test110-runtime-red, test112-runtime-diagnostic, test115-runtime-red, test116-spool-red, test116-spool-green, test116-runtime-red, test116-runtime-diagnostic]
      artifact_id:
        type: string
        required: false
        default: ''
      archive_sha256:
        type: string
        required: false
        default: ''
      ipa_sha256:
        type: string
        required: false
        default: ''
      source_commit:
        type: string
        required: false
        default: ''
      source_sha256:
        type: string
        required: false
        default: ''
      release_id:
        type: string
        required: false
        default: ''
      release_tag:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  native-contract-red:
    needs: native-source-ready
    if: inputs.native_lane == 'full' && needs.native-source-ready.outputs.ready != 'true'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: driver
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Souitou-iop/LoopCtrl
          ref: 6e25cf6a9f65bc86c372cdce94bdb151d0cf6767
          path: upstream
          persist-credentials: false
      - name: Observe original TEST050 public paged-results manifest assertion Red
        run: |
          python3 driver/patches/loopctrl/check_ngg2.py --test051-red-only upstream "$RUNNER_TEMP/ngg2-baseline"
      - name: Save native baseline diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: loopctrl-ngg2-baseline
          path: ${{ runner.temp }}/ngg2-baseline/
          if-no-files-found: error
          retention-days: 30
  test115-runtime-red:
    if: inputs.native_lane == 'test115-runtime-red'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Souitou-iop/LoopCtrl
          ref: 6e25cf6a9f65bc86c372cdce94bdb151d0cf6767
          path: upstream
          persist-credentials: false
          fetch-depth: 0
      - name: Apply sealed sources and pin unchanged Runtime before TEST115 timing fix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/test115-runtime-red/before-source"
          python3 driver/patches/loopctrl/apply_patch.py upstream > "$RUNNER_TEMP/test115-runtime-red/workflow-g1-applied.json"
          python3 driver/patches/loopctrl/apply_ngg2.py upstream > "$RUNNER_TEMP/test115-runtime-red/workflow-g2-applied.json"
          git -C driver show c84e74f8934f88a05b02e4c58a899d2e3ebae519:patches/loopctrl/ngg2/NG2Runtime.swift > "$RUNNER_TEMP/test115-runtime-red/before-source/NG2Runtime.swift"
          echo "dc082fd9658df32924c90423c544030d327c744f4224d4d8c868762a6e2e741f  $RUNNER_TEMP/test115-runtime-red/before-source/NG2Runtime.swift" | shasum -a 256 --check
          python3 - <<'PYCODE' | tee "$RUNNER_TEMP/test115-runtime-red/workflow-source-preconditions.json"
          import ast, hashlib, json, os, subprocess, sys
          from pathlib import Path
          driver, upstream = Path('driver').resolve(), Path('upstream').resolve()
          code = subprocess.check_output(['git','rev-parse','HEAD'],cwd=driver,text=True).strip()
          if code != os.environ['GITHUB_SHA']:
              raise SystemExit('TEST115 Red driver differs from dispatched CODE')
          sys.path.insert(0,str(driver/'patches/loopctrl'))
          from verify_package import inspect_native_sources
          sealed = inspect_native_sources(upstream,driver)
          original = 'dc082fd9658df32924c90423c544030d327c744f4224d4d8c868762a6e2e741f'
          if len(sealed['native_source_sha256']) != 36 or sealed['native_source_sha256']['LoopCtrlUITests/NG2Runtime.swift'] != original:
              raise SystemExit('TEST115 timing Red requires all36 sealed sources and original Runtime')
          tree = ast.parse((driver/'patches/loopctrl/check_runtime115.py').read_text())
          controls = {node.targets[0].id:ast.literal_eval(node.value) for node in tree.body
              if isinstance(node,ast.Assign) and isinstance(node.targets[0],ast.Name)
              and node.targets[0].id in ('GREEN_CASES','RUNTIME_RED_CASE','SCOPE_FINALIZED')}
          if controls != dict(GREEN_CASES=('passage_fresh','partial_view','partial_cancel','post_begin_clock'),
                  RUNTIME_RED_CASE='post_begin_clock', SCOPE_FINALIZED=True):
              raise SystemExit('TEST115 timing Red requires exact author-frozen callbacks')
          print(json.dumps(dict(schema='test115-runtime-red-workflow-source-v1', code=code,
              native_manifest_sha256=hashlib.sha256((driver/'patches/loopctrl/ngg2-manifest.json').read_bytes()).hexdigest(),
              native_source_sha256=sealed['native_source_sha256'], required_cases=['post_begin_clock'],
              expected_assertion='FAIL test115_post_begin_deadline_crossing_never_calls_gesture',
              assertion_red_only=True, ipa_built=False, linux_host_replayed=False, python39_replayed=False),indent=2))
          PYCODE
      - name: Observe TEST115 post-begin clock assertion Red against exact original Runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 driver/patches/loopctrl/check_runtime115.py upstream "$RUNNER_TEMP/test115-runtime-red" --expect-runtime-red --before-runtime "$RUNNER_TEMP/test115-runtime-red/before-source/NG2Runtime.swift" 2>&1 | tee "$RUNNER_TEMP/test115-runtime-red/runtime-command.txt"
      - name: Save TEST115 timing assertion evidence without IPA or other tests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: loopctrl-test115-runtime-red
          path: ${{ runner.temp }}/test115-runtime-red/
          if-no-files-found: error
          retention-days: 30
  test116-spool-red:
    if: inputs.native_lane == 'test116-spool-red' || inputs.native_lane == 'test116-spool-green'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
          fetch-depth: 0
      - name: Pin original TEST115 Spool without applying or building an IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/test116-spool-red/before-source"
          git -C driver show c17ffd2e4c583b16b322dd9e8a973003e179389c:patches/loopctrl/ngg2/NG2CycleSpool.swift > "$RUNNER_TEMP/test116-spool-red/before-source/NG2CycleSpool.swift"
          echo "074d76fc732a2287d14d8dd11256ac4d63462974556006b518f52ee66eefe84f  $RUNNER_TEMP/test116-spool-red/before-source/NG2CycleSpool.swift" | shasum -a 256 --check
          python3 - <<'PYCODE' | tee "$RUNNER_TEMP/test116-spool-red/workflow-source-preconditions.json"
          import hashlib, json, os, subprocess
          from pathlib import Path
          code = subprocess.check_output(['git','-C','driver','rev-parse','HEAD'],text=True).strip()
          if code != os.environ['GITHUB_SHA']:
              raise SystemExit('TEST116 Spool Red driver differs from dispatched CODE')
          before = Path(os.environ['RUNNER_TEMP'])/'test116-spool-red/before-source/NG2CycleSpool.swift'
          digest = hashlib.sha256(before.read_bytes()).hexdigest()
          if digest != '074d76fc732a2287d14d8dd11256ac4d63462974556006b518f52ee66eefe84f':
              raise SystemExit('TEST116 Spool Red before bytes differ')
          print(json.dumps(dict(schema='test116-spool-red-workflow-source-v1',code=code,
              before_spool_sha256=digest,assertion_red_only=True,ipa_built=False,
              native_sources_applied=False,linux_host_replayed=False,python39_replayed=False),indent=2))
          PYCODE
      - name: Observe TEST116 escrow assertion Red against exact original Spool
        shell: bash
        run: |
          set -euo pipefail
          python3 driver/patches/loopctrl/check_cycle_spool116.py "$RUNNER_TEMP/test116-spool-red" --baseline-only --before-spool "$RUNNER_TEMP/test116-spool-red/before-source/NG2CycleSpool.swift" 2>&1 | tee "$RUNNER_TEMP/test116-spool-red/spool-command.txt"
      - name: Verify TEST116 current Spool with the same author-frozen filesystem cases
        if: inputs.native_lane == 'test116-spool-green'
        shell: bash
        run: |
          set -euo pipefail
          python3 driver/patches/loopctrl/check_cycle_spool116.py "$RUNNER_TEMP/test116-spool-red/current" 2>&1 | tee "$RUNNER_TEMP/test116-spool-red/current-command.txt"
      - name: Save TEST116 Spool assertion evidence without other tests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: loopctrl-${{ inputs.native_lane }}
          path: ${{ runner.temp }}/test116-spool-red/
          if-no-files-found: error
          retention-days: 30
  test116-runtime-red:
    if: inputs.native_lane == 'test116-runtime-red' || inputs.native_lane == 'test116-runtime-diagnostic'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Souitou-iop/LoopCtrl
          ref: 6e25cf6a9f65bc86c372cdce94bdb151d0cf6767
          path: upstream
          persist-credentials: false
          fetch-depth: 0
      - name: Apply sealed sources and pin original TEST115 Runtime for API assertion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/test116-runtime-red/before-source"
          python3 driver/patches/loopctrl/apply_patch.py upstream > "$RUNNER_TEMP/test116-runtime-red/workflow-g1-applied.json"
          python3 driver/patches/loopctrl/apply_ngg2.py upstream > "$RUNNER_TEMP/test116-runtime-red/workflow-g2-applied.json"
          git -C driver show c17ffd2e4c583b16b322dd9e8a973003e179389c:patches/loopctrl/ngg2/NG2Runtime.swift > "$RUNNER_TEMP/test116-runtime-red/before-source/NG2Runtime.swift"
          echo "e655aa10f0ba48a9e2f719e25a5cbd9c7f5c69f6e907de0ac1bcae9da228dbe0  $RUNNER_TEMP/test116-runtime-red/before-source/NG2Runtime.swift" | shasum -a 256 --check
          python3 - <<'PYCODE' | tee "$RUNNER_TEMP/test116-runtime-red/workflow-source-preconditions.json"
          import ast, hashlib, json, os, subprocess
          from pathlib import Path
          code = subprocess.check_output(['git','-C','driver','rev-parse','HEAD'],text=True).strip()
          if code != os.environ['GITHUB_SHA']:
              raise SystemExit('TEST116 Runtime Red driver differs from dispatched CODE')
          tree = ast.parse(Path('driver/patches/loopctrl/check_runtime116.py').read_text())
          wanted = {'BEFORE_RUNTIME_SHA256':'e655aa10f0ba48a9e2f719e25a5cbd9c7f5c69f6e907de0ac1bcae9da228dbe0',
              'EXPECTED_RUNTIME_RED_ASSERTION':'FAIL test116_continuous_native_mode_is_admitted_without_old_pause_yield'}
          controls = {node.targets[0].id:ast.literal_eval(node.value) for node in tree.body
              if isinstance(node,ast.Assign) and isinstance(node.targets[0],ast.Name) and node.targets[0].id in wanted}
          if controls != wanted:
              raise SystemExit('TEST116 Runtime Red author assertion or source differs')
          print(json.dumps(dict(schema='test116-runtime-red-workflow-source-v1',code=code,
              before_runtime_sha256=wanted['BEFORE_RUNTIME_SHA256'],
              expected_assertion=wanted['EXPECTED_RUNTIME_RED_ASSERTION'],assertion_red_only=True,
              ipa_built=False,linux_host_replayed=False,python39_replayed=False),indent=2))
          PYCODE
      - name: Observe TEST116 new-mode assertion Red against exact original Runtime
        if: inputs.native_lane == 'test116-runtime-red'
        shell: bash
        run: |
          set -euo pipefail
          python3 driver/patches/loopctrl/check_runtime116.py upstream "$RUNNER_TEMP/test116-runtime-red" --expect-runtime-red --before-runtime "$RUNNER_TEMP/test116-runtime-red/before-source/NG2Runtime.swift" 2>&1 | tee "$RUNNER_TEMP/test116-runtime-red/runtime-command.txt"
      - name: Diagnose only TEST116 admission and normal-chain callbacks without final acceptance
        if: inputs.native_lane == 'test116-runtime-diagnostic'
        shell: bash
        run: |
          set -euo pipefail
          python3 driver/patches/loopctrl/check_runtime116.py upstream "$RUNNER_TEMP/test116-runtime-red/current-diagnostic" --diagnostic 2>&1 | tee "$RUNNER_TEMP/test116-runtime-red/diagnostic-command.txt"
      - name: Save TEST116 Runtime assertion evidence without IPA or other tests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: loopctrl-${{ inputs.native_lane }}
          path: ${{ runner.temp }}/test116-runtime-red/
          if-no-files-found: error
          retention-days: 30
  test112-runtime-diagnostic:
    if: inputs.native_lane == 'test112-runtime-diagnostic'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Souitou-iop/LoopCtrl
          ref: 6e25cf6a9f65bc86c372cdce94bdb151d0cf6767
          path: upstream
          persist-credentials: false
          fetch-depth: 0
      - name: Apply and inspect exact sealed G1 and G2 sources for TEST112 Runtime diagnosis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/test112-runtime-diagnostic"
          python3 driver/patches/loopctrl/apply_patch.py upstream > "$RUNNER_TEMP/test112-runtime-diagnostic/workflow-g1-applied.json"
          python3 driver/patches/loopctrl/apply_ngg2.py upstream > "$RUNNER_TEMP/test112-runtime-diagnostic/workflow-g2-applied.json"
          python3 - <<'PYCODE' | tee "$RUNNER_TEMP/test112-runtime-diagnostic/workflow-source-preconditions.json"
          import ast, hashlib, json, os, subprocess, sys
          from pathlib import Path
          driver, upstream = Path('driver').resolve(), Path('upstream').resolve()
          code = subprocess.check_output(['git','rev-parse','HEAD'],cwd=driver,text=True).strip()
          if code != os.environ['GITHUB_SHA']:
              raise SystemExit('TEST112 diagnostic driver differs from dispatched CODE')
          sys.path.insert(0,str(driver/'patches/loopctrl'))
          from verify_package import inspect_native_sources
          sealed = inspect_native_sources(upstream,driver)
          if len(sealed['native_source_sha256']) != 36:
              raise SystemExit('TEST112 diagnostic native inventory must be36 sealed sources')
          manifest = json.loads((driver/'patches/loopctrl/ngg2-manifest.json').read_bytes())
          if manifest.get('api_version') != '1.98.16-ngg2' or manifest.get('restart_yield_capability') != 'necrogold_native_restart_yield_v1' or manifest.get('restart_yield_start_flag') != 'yield_after_restart':
              raise SystemExit('TEST112 diagnostic API/capability/startflag source identity differs')
          tree = ast.parse((driver/'patches/loopctrl/check_runtime112.py').read_text())
          controls = {node.targets[0].id:ast.literal_eval(node.value) for node in tree.body
              if isinstance(node,ast.Assign) and isinstance(node.targets[0],ast.Name)
              and node.targets[0].id in ('GREEN_CASES','SCOPE_FINALIZED')}
          expected = ('legacy','yield','first_partial','first_full','producer_return','commit_return','capture_drain','upper_entry')
          if controls != dict(GREEN_CASES=expected,SCOPE_FINALIZED=True):
              raise SystemExit('TEST112 diagnostic requires exact finalized current8 callbacks')
          report = dict(schema='test112-runtime-diagnostic-workflow-source-v1',code=code,
              native_manifest_sha256=hashlib.sha256((driver/'patches/loopctrl/ngg2-manifest.json').read_bytes()).hexdigest(),
              native_source_sha256=sealed['native_source_sha256'],required_cases=list(expected),
              diagnostic_only=True,ipa_built=False,linux_host_replayed=False,old_runtime_api_red_replayed=False)
          print(json.dumps(report,indent=2))
          PYCODE
      - name: Diagnose only the finalized eight TEST112 current Runtime callbacks
        shell: bash
        run: |
          set -euo pipefail
          python3 driver/patches/loopctrl/check_runtime112.py upstream "$RUNNER_TEMP/test112-runtime-diagnostic" 2>&1 | tee "$RUNNER_TEMP/test112-runtime-diagnostic/runtime-command.txt"
      - name: Save TEST112 current Runtime diagnostic evidence without IPA
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: loopctrl-test112-runtime-diagnostic
          path: ${{ runner.temp }}/test112-runtime-diagnostic/
          if-no-files-found: error
          retention-days: 30
  test110-runtime-red:
    if: inputs.native_lane == 'test110-runtime-red'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: driver
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Souitou-iop/LoopCtrl
          ref: 6e25cf6a9f65bc86c372cdce94bdb151d0cf6767
          path: upstream
          persist-credentials: false
      - name: Apply the sealed TEST110 normal fixes before Runtime edits
        run: |
          mkdir -p "$RUNNER_TEMP/test110-runtime-red"
          python3 driver/patches/loopctrl/apply_patch.py upstream > "$RUNNER_TEMP/test110-runtime-red/workflow-g1-applied.json"
          python3 driver/patches/loopctrl/apply_ngg2.py upstream > "$RUNNER_TEMP/test110-runtime-red/workflow-g2-applied.json"
      - name: Pin the old Runtime and the two reviewed normal native changes
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          baseline = 'c2f76243c77a51682c24a4e059002cd732fd547d'
          driver = Path('driver')
          current = json.loads((driver/'patches/loopctrl/ngg2-manifest.json').read_bytes())
          previous = json.loads(subprocess.check_output(['git', 'show', baseline+':patches/loopctrl/ngg2-manifest.json'], cwd=driver))
          def sources(value):
              return {**{path:row['patched_sha256'] for path,row in value['files'].items()},
                      **{path:row['sha256'] for path,row in value['additions'].items()}}
          old, new = sources(previous), sources(current)
          expected = {'LoopCtrlUITests/NG2Controller.c', 'LoopCtrlUITests/NG2Perception.c'}
          if old.keys() != new.keys() or len(new) != 36 or {path for path in old if old[path] != new[path]} != expected:
              raise SystemExit('TEST110 Red requires only the two sealed normal native changes')
          runtime = 'LoopCtrlUITests/NG2Runtime.swift'
          actual = hashlib.sha256((Path('upstream')/runtime).read_bytes()).hexdigest()
          wanted = '42f2f88634357083e82be64e56e6ba0806f26454e278b74782caee763c5bb3e8'
          if actual != wanted or new[runtime] != wanted or old[runtime] != wanted:
              raise SystemExit('TEST110 Red requires the original unmodified Runtime source')
          code = subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=driver, text=True).strip()
          if code != os.environ['GITHUB_SHA']:
              raise SystemExit('TEST110 Red driver source differs from the dispatched commit')
          report = dict(schema='test110-runtime-red-workflow-source-v1', code=code, baseline=baseline,
                        native_sources=36, native_changed=sorted(expected), runtime_sha256=actual,
                        semantic_execution=False, compiler_execution=False)
          destination = Path(os.environ['RUNNER_TEMP'])/'test110-runtime-red/workflow-source-preconditions.json'
          destination.write_text(json.dumps(report, indent=2)+'\n')
          PY
      - name: Verify only the named TEST110 old-Runtime semantic assertions Red
        run: python3 driver/patches/loopctrl/check_runtime110.py upstream "$RUNNER_TEMP/test110-runtime-red" --expect-red
      - name: Save the TEST110 before-source and actual assertion Red evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: loopctrl-test110-runtime-red
          path: ${{ runner.temp }}/test110-runtime-red/
          if-no-files-found: error
          retention-days: 30
  test099-runtime-red:
    if: inputs.native_lane == 'test099-runtime-red' || inputs.native_lane == 'test099-runtime-diagnostic' || inputs.native_lane == 'test099-runtime-remaining'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: driver
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Souitou-iop/LoopCtrl
          ref: 6e25cf6a9f65bc86c372cdce94bdb151d0cf6767
          path: upstream
          persist-credentials: false
      - name: Apply sealed C companions for the Runtime099 semantic Red
        run: |
          python3 driver/patches/loopctrl/apply_patch.py upstream
          python3 driver/patches/loopctrl/apply_ngg2.py upstream
      - name: Verify only the named old Runtime099 record assertion Red
        if: inputs.native_lane == 'test099-runtime-red'
        run: python3 driver/patches/loopctrl/check_runtime099.py upstream "$RUNNER_TEMP/test099-runtime-red" --red-only
      - name: Diagnose only the current Runtime099 immutable snapshot callback
        if: inputs.native_lane == 'test099-runtime-diagnostic'
        run: python3 driver/patches/loopctrl/check_runtime099.py upstream "$RUNNER_TEMP/test099-runtime-diagnostic" --pin-diagnostic
      - name: Verify only the three remaining Runtime099 callbacks
        if: inputs.native_lane == 'test099-runtime-remaining'
        run: python3 driver/patches/loopctrl/check_runtime099.py upstream "$RUNNER_TEMP/test099-runtime-remaining" --remaining
      - name: Save original Runtime099 semantic assertion Red evidence
        if: always() && inputs.native_lane == 'test099-runtime-red'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: loopctrl-test099-runtime-red
          path: ${{ runner.temp }}/test099-runtime-red/
          if-no-files-found: error
          retention-days: 30
      - name: Save selected current Runtime099 snapshot diagnostics
        if: always() && inputs.native_lane == 'test099-runtime-diagnostic'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: loopctrl-test099-runtime-diagnostic
          path: ${{ runner.temp }}/test099-runtime-diagnostic/
          if-no-files-found: error
          retention-days: 30
